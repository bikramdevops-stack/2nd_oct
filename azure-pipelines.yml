trigger:
 - feature/*
 - main

pool: mypool

stages:
  - stage: Plan
    displayName: terraformplan
    jobs:
      - job: 
        displayName: myjob
        steps:
          - task: TerraformInstaller@1
            displayName: terraforminstall
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTask@5
            displayName: terraforminit
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'newservice'
              backendAzureRmStorageAccountName: 'mystoagebhakua'
              backendAzureRmContainerName: 'mycontainer'
              backendAzureRmKey: 'terraform.tfstate'
          - task: TerraformTask@5
            displayName: terraformvalidate
            inputs:
              provider: 'azurerm'
              command: 'validate'
          - task: TerraformTask@5
            displayName: terraformplan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'newservice'
 
  - stage: apply
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    displayName: terraformapply
    jobs:
      - job: approval
        displayName: Approval
        pool: server
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'abc@abcjs'

      - job: apply
        dependsOn: approval
        displayName: apply
        steps:
          - task: TerraformTask@5
            displayName: terraforminit
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'newservice'
              backendAzureRmStorageAccountName: 'mystoagebhakua'
              backendAzureRmContainerName: 'mycontainer'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'newservice'
          
              

            