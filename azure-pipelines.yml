trigger:
 - feature/*
 - main

pool: mypool

stages:
  - stage: plan

    jobs:
      - job: Plan
        displayName: Terraform Plan
        steps:
          - task: TerraformInstaller@1
            displayName: Terraform install
            inputs:
              terraformVersion: 'latest'
            
          - task: TerraformTask@5
            displayName: Terraform init
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'newservice'
              backendAzureRmStorageAccountName: 'devopsstorage11'
              backendAzureRmContainerName: 'bikramcontainer'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            displayName: Terraform validate
            inputs:
              provider: 'azurerm'
              command: 'validate'

          - task: TerraformTask@5
            displayName: Terraform plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'newservice'

  - stage: Apply
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    displayName: Apply
    
    jobs:
      - job: Manualapproval
        displayName: Approval
        pool: server
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'abcansd@erv'

      - job: apply
        steps:
          - task: TerraformTask@5
            displayName: Terraform init
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'newservice'
              backendAzureRmStorageAccountName: 'devopsstorage11'
              backendAzureRmContainerName: 'bikramcontainer'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'newservice'
